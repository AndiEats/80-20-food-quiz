<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>80/20 Food Preference Quiz</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f3ed;
        color: #333;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 900px;
        background: white;
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    h1 {
        text-align: center;
        margin: 0 0 10px;
        font-size: 36px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
        font-size: 16px;
    }

    .progress-container {
        margin-bottom: 30px;
    }

    .progress-text {
        text-align: center;
        font-size: 14px;
        color: #777;
        margin-bottom: 8px;
    }

    .progress-bar {
        width: 100%;
        height: 10px;
        background: #e8e8e8;
        border-radius: 20px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: #78a878;
        border-radius: 20px;
        transition: width 0.25s ease;
    }

    .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .food-card {
        border: 3px solid transparent;
        border-radius: 20px;
        padding: 18px;
        text-align: center;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease,
                    box-shadow 0.15s ease;
        background: #fafafa;
    }

    .food-card:hover {
        transform: translateY(-5px);
        border-color: #78a878;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.10);
    }

    .food-image {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 16px;
        display: block;
        margin-bottom: 15px;
    }

    .food-name {
        font-size: 22px;
        font-weight: bold;
    }

    .results {
        display: none;
    }

    .results h2 {
        text-align: center;
        margin-top: 0;
        font-size: 30px;
    }

    .results-subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .ranking {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .ranking-item {
        display: flex;
        align-items: center;
        gap: 15px;
        background: #f7f7f7;
        padding: 12px 16px;
        border-radius: 14px;
    }

    .rank-number {
        width: 35px;
        font-size: 20px;
        font-weight: bold;
        text-align: center;
    }

    .rank-image {
        width: 55px;
        height: 55px;
        object-fit: cover;
        border-radius: 10px;
    }

    .rank-name {
        flex: 1;
        font-size: 18px;
        font-weight: bold;
    }

    .rank-score {
        color: #777;
        font-size: 14px;
    }

    .restart-button {
        display: block;
        margin: 30px auto 0;
        border: none;
        background: #78a878;
        color: white;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .restart-button:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    @media (max-width: 650px) {
        body {
            padding: 10px;
        }

        .container {
            padding: 22px;
            border-radius: 18px;
        }

        h1 {
            font-size: 28px;
        }

        .choices {
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .food-card {
            padding: 10px;
            border-radius: 14px;
        }

        .food-name {
            font-size: 17px;
        }

        .food-image {
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .rank-image {
            width: 45px;
            height: 45px;
        }

        .rank-name {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div id="quiz">

        <h1>80/20 Food Preference Quiz</h1>

        <div class="subtitle">
            Pick the food you'd rather have.
        </div>

        <div class="progress-container">
            <div class="progress-text" id="progressText">
                Question 1 of 40
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="choices">

            <div class="food-card" id="foodCard1" onclick="chooseFood(0)">
                <img
                    class="food-image"
                    id="foodImage1"
                    src=""
                    alt=""
                >

                <div class="food-name" id="foodName1"></div>
            </div>

            <div class="food-card" id="foodCard2" onclick="chooseFood(1)">
                <img
                    class="food-image"
                    id="foodImage2"
                    src=""
                    alt=""
                >

                <div class="food-name" id="foodName2"></div>
            </div>

        </div>

    </div>


    <div class="results" id="results">

        <h2>Your Food Ranking</h2>

        <div class="results-subtitle">
            Based on your choices throughout the quiz.
        </div>

        <div class="ranking" id="ranking"></div>

        <button class="restart-button" onclick="restartQuiz()">
            Take Quiz Again
        </button>

    </div>

</div>


<script>

    // ==========================================
    // QUIZ SETTINGS
    // ==========================================

    const TOTAL_QUESTIONS = 40;


    // ==========================================
    // FOOD LIST
    // ==========================================

    const foods = [
        {
            name: "Donuts",
            image: "donuts.jpg",
            score: 1000
        },
        {
            name: "Cookies",
            image: "cookies.jpg",
            score: 1000
        },
        {
            name: "Brownies",
            image: "brownies.jpg",
            score: 1000
        },
        {
            name: "Cake",
            image: "cake.jpg",
            score: 1000
        },
        {
            name: "Chocolate",
            image: "chocolate.jpg",
            score: 1000
        },
        {
            name: "Hard Candy",
            image: "hard-candy.jpg",
            score: 1000
        },
        {
            name: "Pie",
            image: "pie.jpg",
            score: 1000
        },
        {
            name: "Cupcakes",
            image: "cupcakes.jpg",
            score: 1000
        },
        {
            name: "Rice Krispy Treats",
            image: "rice-krispy-treats.jpg",
            score: 1000
        },
        {
            name: "Pizza",
            image: "pizza.jpg",
            score: 1000
        },
        {
            name: "French Fries",
            image: "french-fries.jpg",
            score: 1000
        },
        {
            name: "Pretzels",
            image: "pretzels.jpg",
            score: 1000
        },
        {
            name: "Soda",
            image: "soda.jpg",
            score: 1000
        },
        {
            name: "Hot Cocoa",
            image: "hot-cocoa.jpg",
            score: 1000
        },
        {
            name: "Milkshakes",
            image: "milkshakes.jpg",
            score: 1000
        },
        {
            name: "Ice Cream",
            image: "ice-cream.jpg",
            score: 1000
        },
        {
            name: "Lemonade",
            image: "lemonade.jpg",
            score: 1000
        },
        {
            name: "Slushies",
            image: "slushies.jpg",
            score: 1000
        }
    ];


    // ==========================================
    // QUIZ VARIABLES
    // ==========================================

    let questions = [];
    let currentQuestion = 0;
    let currentPair = [];


    // ==========================================
    // SHUFFLE FUNCTION
    // ==========================================

    function shuffle(array) {

        const shuffled = [...array];

        for (let i = shuffled.length - 1; i > 0; i--) {

            const j = Math.floor(Math.random() * (i + 1));

            [shuffled[i], shuffled[j]] =
            [shuffled[j], shuffled[i]];
        }

        return shuffled;
    }


    // ==========================================
    // CREATE A UNIQUE PAIR KEY
    // ==========================================

    function pairKey(a, b) {

        const smaller = Math.min(a, b);
        const larger = Math.max(a, b);

        return `${smaller}-${larger}`;
    }


    // ==========================================
    // BUILD THE ENTIRE QUIZ BEFORE IT STARTS
    // ==========================================

    function buildQuestionList() {

        questions = [];

        const usedPairs = new Set();

        /*
            First, we make sure EVERY food appears.

            We shuffle all foods, then connect each new
            food to one that has already appeared.

            With 18 foods, this creates 17 questions
            that guarantee all 18 foods are included.
        */

        const foodOrder = shuffle(
            foods.map((food, index) => index)
        );

        const includedFoods = [foodOrder[0]];

        for (let i = 1; i < foodOrder.length; i++) {

            const newFood = foodOrder[i];

            const randomExistingFood =
                includedFoods[
                    Math.floor(
                        Math.random() * includedFoods.length
                    )
                ];

            const key = pairKey(
                newFood,
                randomExistingFood
            );

            questions.push({
                a: newFood,
                b: randomExistingFood
            });

            usedPairs.add(key);

            includedFoods.push(newFood);
        }


        /*
            Now we have guaranteed that every food appears.

            We need 40 total questions, so we fill the
            remaining spots with random unused pairs.
        */

        const allPairs = [];

        for (let a = 0; a < foods.length; a++) {

            for (let b = a + 1; b < foods.length; b++) {

                const key = pairKey(a, b);

                if (!usedPairs.has(key)) {

                    allPairs.push({
                        a: a,
                        b: b,
                        key: key
                    });

                }
            }
        }


        const shuffledRemainingPairs =
            shuffle(allPairs);


        const remainingQuestions =
            TOTAL_QUESTIONS - questions.length;


        for (
            let i = 0;
            i < remainingQuestions &&
            i < shuffledRemainingPairs.length;
            i++
        ) {

            questions.push({
                a: shuffledRemainingPairs[i].a,
                b: shuffledRemainingPairs[i].b
            });

        }


        /*
            Shuffle the finished question list.

            This is important because otherwise the
            guaranteed-coverage questions would always
            happen at the beginning.
        */

        questions = shuffle(questions);

    }


    // ==========================================
    // START QUIZ
    // ==========================================

    function startQuiz() {

        currentQuestion = 0;
        currentPair = [];

        foods.forEach(food => {
            food.score = 1000;
        });

        buildQuestionList();

        document.getElementById("quiz").style.display = "block";
        document.getElementById("results").style.display = "none";

        showNextQuestion();
    }


    // ==========================================
    // SHOW NEXT QUESTION
    // ==========================================

    function showNextQuestion() {

        if (currentQuestion >= questions.length) {

            showResults();
            return;

        }


        currentPair = [
            questions[currentQuestion].a,
            questions[currentQuestion].b
        ];


        const food1 = foods[currentPair[0]];
        const food2 = foods[currentPair[1]];


        document.getElementById("foodImage1").src =
            food1.image;

        document.getElementById("foodImage1").alt =
            food1.name;

        document.getElementById("foodName1").textContent =
            food1.name;


        document.getElementById("foodImage2").src =
            food2.image;

        document.getElementById("foodImage2").alt =
            food2.name;

        document.getElementById("foodName2").textContent =
            food2.name;


        const questionNumber = currentQuestion + 1;

        document.getElementById("progressText").textContent =
            `Question ${questionNumber} of ${questions.length}`;


        const progress =
            (currentQuestion / questions.length) * 100;

        document.getElementById("progressFill").style.width =
            `${progress}%`;

    }


    // ==========================================
    // CHOOSE FOOD
    // ==========================================

    function chooseFood(choice) {

        const chosenIndex = currentPair[choice];

        const otherIndex = currentPair[1 - choice];


        // Winner gets points
        foods[chosenIndex].score += 25;

        // Food that wasn't chosen loses points
        foods[otherIndex].score -= 25;


        currentQuestion++;

        showNextQuestion();

    }


    // ==========================================
    // SHOW RESULTS
    // ==========================================

    function showResults() {

        document.getElementById("quiz").style.display =
            "none";

        document.getElementById("results").style.display =
            "block";

        document.getElementById("progressFill").style.width =
            "100%";


        const rankedFoods = [...foods].sort(
            (a, b) => b.score - a.score
        );


        const ranking = document.getElementById("ranking");

        ranking.innerHTML = "";


        rankedFoods.forEach((food, index) => {

            const item = document.createElement("div");

            item.className = "ranking-item";


            item.innerHTML = `
                <div class="rank-number">
                    ${index + 1}
                </div>

                <img
                    class="rank-image"
                    src="${food.image}"
                    alt="${food.name}"
                >

                <div class="rank-name">
                    ${food.name}
                </div>

                <div class="rank-score">
                    ${food.score} pts
                </div>
            `;


            ranking.appendChild(item);

        });

    }


    // ==========================================
    // RESTART QUIZ
    // ==========================================

    function restartQuiz() {

        startQuiz();

    }


    // ==========================================
    // START AUTOMATICALLY
    // ==========================================

    startQuiz();

</script>

</body>
</html>
