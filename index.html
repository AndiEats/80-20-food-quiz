<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 80/20 Food Ranking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ed;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .progress-section {
            margin-bottom: 30px;
        }

        #progressText {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e8e4df;
            border-radius: 20px;
            overflow: hidden;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: #7aa37a;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .food-card {
            border: 3px solid #e5e0d9;
            border-radius: 20px;
            padding: 30px 20px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            background: #fff;
        }

        .food-card:hover {
            transform: translateY(-5px);
            border-color: #7aa37a;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .food-emoji {
            font-size: 5rem;
            margin-bottom: 15px;
        }

        .food-name {
            font-size: 1.4rem;
            font-weight: bold;
        }

        #results {
            display: none;
        }

        #results h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .results-subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .ranking {
            text-align: left;
            margin: 0 auto 30px;
            max-width: 600px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 18px;
            margin-bottom: 10px;
            background: #f7f3ed;
            border-radius: 14px;
            font-size: 1.1rem;
        }

        .rank-number {
            font-weight: bold;
            width: 35px;
        }

        .rank-emoji {
            font-size: 1.8rem;
        }

        .restart-button {
            border: none;
            background: #7aa37a;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .restart-button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        @media (max-width: 650px) {
            .app {
                padding: 25px 18px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .choices {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .food-card {
                padding: 25px 15px;
            }

            .food-emoji {
                font-size: 4rem;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div id="quiz">

        <h1>My 80/20 Food Ranking</h1>

        <p class="subtitle">
            Choose the food you would rather have.
            Your choices will create your personalized ranking.
        </p>

        <div class="progress-section">
            <div id="progressText">Choice 1 of 20</div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
        </div>

        <div class="choices">

            <div class="food-card" id="foodCard1" onclick="chooseFood(0)">
                <div class="food-emoji" id="emoji1">🍕</div>
                <div class="food-name" id="foodName1">Pizza</div>
            </div>

            <div class="food-card" id="foodCard2" onclick="chooseFood(1)">
                <div class="food-emoji" id="emoji2">🍪</div>
                <div class="food-name" id="foodName2">Cookies</div>
            </div>

        </div>

    </div>


    <div id="results">

        <h2>Your Food Ranking</h2>

        <p class="results-subtitle">
            Based on the choices you made.
        </p>

        <div class="ranking" id="ranking"></div>

        <button class="restart-button" onclick="restartQuiz()">
            Start Over
        </button>

    </div>

</div>


<script>

    // ==========================================
    // QUIZ SETTINGS
    // ==========================================

    const TOTAL_CHOICES = 20;


    // ==========================================
    // FOOD LIST
    // ==========================================

    const foods = [
        {
            name: "Pizza",
            emoji: "🍕",
            score: 1000
        },
        {
            name: "Donuts",
            emoji: "🍩",
            score: 1000
        },
        {
            name: "Ice Cream",
            emoji: "🍦",
            score: 1000
        },
        {
            name: "French Fries",
            emoji: "🍟",
            score: 1000
        },
        {
            name: "Cookies",
            emoji: "🍪",
            score: 1000
        },
        {
            name: "Chocolate",
            emoji: "🍫",
            score: 1000
        },
        {
            name: "Burgers",
            emoji: "🍔",
            score: 1000
        },
        {
            name: "Cake",
            emoji: "🍰",
            score: 1000
        }
    ];


    // ==========================================
    // QUIZ VARIABLES
    // ==========================================

    let currentChoice = 0;

    // This remembers every pair that has already been shown.
    // A Set is useful because it automatically keeps each pair unique.
    let usedPairs = new Set();


    // ==========================================
    // START THE QUIZ
    // ==========================================

    function startQuiz() {

        currentChoice = 0;

        usedPairs.clear();

        foods.forEach(food => {
            food.score = 1000;
        });

        document.getElementById("quiz").style.display = "block";
        document.getElementById("results").style.display = "none";

        showNextPair();
    }


    // ==========================================
    // FIND A NEW PAIR
    // ==========================================

    function showNextPair() {

        // If we've completed all choices, show the results.
        if (currentChoice >= TOTAL_CHOICES) {
            showResults();
            return;
        }


        let firstIndex;
        let secondIndex;
        let pairKey;

        // Keep picking random foods until we find
        // a pair that has NOT been shown before.
        do {

            firstIndex = Math.floor(Math.random() * foods.length);

            secondIndex = Math.floor(Math.random() * foods.length);

            // Make sure the two foods are different.
            if (firstIndex === secondIndex) {
                continue;
            }

            // Sort the numbers so that:
            // Pizza vs Cookies
            // and
            // Cookies vs Pizza
            // produce the same pair key.
            const smallerIndex = Math.min(firstIndex, secondIndex);
            const largerIndex = Math.max(firstIndex, secondIndex);

            pairKey = `${smallerIndex}-${largerIndex}`;

        } while (usedPairs.has(pairKey));


        // Remember this pair so it can't appear again.
        usedPairs.add(pairKey);


        // Display the two foods.
        document.getElementById("emoji1").textContent =
            foods[firstIndex].emoji;

        document.getElementById("foodName1").textContent =
            foods[firstIndex].name;

        document.getElementById("emoji2").textContent =
            foods[secondIndex].emoji;

        document.getElementById("foodName2").textContent =
            foods[secondIndex].name;


        // Save which foods are currently being compared.
        currentPair = [firstIndex, secondIndex];


        // Update progress.
        document.getElementById("progressText").textContent =
            `Choice ${currentChoice + 1} of ${TOTAL_CHOICES}`;

        const progressPercent =
            (currentChoice / TOTAL_CHOICES) * 100;

        document.getElementById("progressFill").style.width =
            `${progressPercent}%`;
    }


    // ==========================================
    // CURRENT PAIR
    // ==========================================

    let currentPair = [];


    // ==========================================
    // WHEN THE USER CHOOSES A FOOD
    // ==========================================

    function chooseFood(choice) {

        const chosenIndex = currentPair[choice];

        const otherIndex = currentPair[1 - choice];


        // Give the chosen food points.
        foods[chosenIndex].score += 25;

        // Take points away from the food that wasn't chosen.
        foods[otherIndex].score -= 25;


        // Move to the next question.
        currentChoice++;

        showNextPair();
    }


    // ==========================================
    // SHOW FINAL RESULTS
    // ==========================================

    function showResults() {

        document.getElementById("quiz").style.display = "none";
        document.getElementById("results").style.display = "block";


        // Sort foods from highest score to lowest score.
        const sortedFoods = [...foods].sort(
            (a, b) => b.score - a.score
        );


        const rankingContainer =
            document.getElementById("ranking");

        rankingContainer.innerHTML = "";


        sortedFoods.forEach((food, index) => {

            const rankingItem =
                document.createElement("div");

            rankingItem.className = "ranking-item";

            rankingItem.innerHTML = `
                <div class="rank-number">
                    ${index + 1}.
                </div>

                <div class="rank-emoji">
                    ${food.emoji}
                </div>

                <div>
                    ${food.name}
                </div>
            `;

            rankingContainer.appendChild(rankingItem);

        });
    }


    // ==========================================
    // RESTART
    // ==========================================

    function restartQuiz() {

        currentChoice = 0;

        usedPairs.clear();

        foods.forEach(food => {
            food.score = 1000;
        });

        document.getElementById("results").style.display = "none";
        document.getElementById("quiz").style.display = "block";

        showNextPair();
    }


    // ==========================================
    // START EVERYTHING
    // ==========================================

    startQuiz();

</script>

</body>
</html>
